/* Layout: faixa de aviso + topo com abas; conteúdo em coluna central de 1120px.
   Configurador = coluna de formulário + coluna fixa com prévia 3D, resumo e preço. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EFEB; --stage:#E4EAE6;
  --ink:#17211D; --ink-2:#52625B; --line:#D2DAD5;
  --accent:#0A6B58; --accent-ink:#FFFFFF; --accent-soft:#D8EEE6;
  --warn:#8A4F00; --warn-soft:#FBEBCF; --good:#1C7041; --good-soft:#DAF0E1; --bad:#A12E2A; --bad-soft:#FADFDD;
  --f-display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --surface-2:#1E2824; --stage:#1B2420;
  --ink:#E6EEE9; --ink-2:#9AA9A2; --line:#2B3732;
  --accent:#4FC4A8; --accent-ink:#07201A; --accent-soft:#143B32;
  --warn:#E9B35E; --warn-soft:#382A11; --good:#6DD197; --good-soft:#143222; --bad:#F28C86; --bad-soft:#3C1A18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --surface-2:#1E2824; --stage:#1B2420;
  --ink:#E6EEE9; --ink-2:#9AA9A2; --line:#2B3732;
  --accent:#4FC4A8; --accent-ink:#07201A; --accent-soft:#143B32;
  --warn:#E9B35E; --warn-soft:#382A11; --good:#6DD197; --good-soft:#143222; --bad:#F28C86; --bad-soft:#3C1A18; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;padding-inline:0}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
small,.sm-t{font-size:.8125rem;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:.8125rem;padding:.4rem 1rem;text-align:center;border-bottom:1px solid var(--line)}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:.7rem 1rem;display:flex;gap:.75rem 1.25rem;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--f-display);font-size:1.1rem;color:var(--ink);margin-right:auto}
.brand b{font-weight:800}.brand svg{color:var(--accent)}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who-n{font-weight:600;font-size:.875rem}.who-u{font-size:.75rem;color:var(--ink-2)}
.tabs{max-width:1120px;margin:0 auto;padding:0 1rem .55rem;display:flex;gap:.25rem;flex-wrap:wrap}
.tab{background:none;border:0;border-radius:6px;padding:.4rem .75rem;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:.9rem;display:flex;gap:.4rem;align-items:center}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.7rem;padding:0 .45rem;min-width:1.2rem;text-align:center;font-weight:600}
.wrap{max-width:1120px;margin:0 auto;padding:1.5rem 1rem 6rem;display:flex;flex-direction:column;gap:1.5rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem 1rem;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;gap:.4rem;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:.3rem .65rem;font-size:.8125rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.stack{display:flex;flex-direction:column;gap:.75rem}
.lead{color:var(--ink-2);max-width:62ch}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:99px;padding:.1rem .6rem;font-size:.75rem;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
/* login */
.login{max-width:1000px;margin:0 auto;padding:2rem 1rem 4rem;display:flex;flex-direction:column;gap:1.75rem}
.persona{display:flex;flex-direction:column;gap:.75rem}
.persona .seg{display:flex;gap:.5rem;flex-wrap:wrap}
.persona dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.15rem .75rem;font-size:.85rem}
.persona dt{color:var(--ink-2)}.persona dd{margin:0}
/* stepper */
.steps{list-style:none;margin:0;padding:0;display:flex;gap:.35rem;flex-wrap:wrap}
.steps button{display:flex;gap:.4rem;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.25rem .75rem .25rem .3rem;cursor:pointer;font-size:.8125rem;font-weight:500;color:var(--ink-2)}
.steps .n{width:1.35rem;height:1.35rem;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.steps li.cur button{border-color:var(--accent);color:var(--ink);font-weight:600}
.steps li.cur .n{background:var(--accent);color:var(--accent-ink)}
.steps li.done .n{background:var(--good-soft);color:var(--good)}
.cfg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:1.25rem;align-items:start}
@media (max-width:900px){.cfg{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:7.5rem;display:flex;flex-direction:column;gap:.75rem}
@media (max-width:900px){.side{position:static}}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:.5rem}
.stage svg{display:block;width:100%;height:auto;max-height:290px}
.opts{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.8rem;cursor:pointer;display:flex;flex-direction:column;gap:.25rem}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-family:var(--f-display)}
.opt .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label,.lbl{font-weight:600;font-size:.85rem}
input[type=number],input[type=text],input[type=date],textarea,select{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:.5rem .65rem;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type=number]{font-family:var(--f-mono)}
textarea{min-height:5rem;resize:vertical}
.hint{font-size:.78rem;color:var(--ink-2)}.hint.err{color:var(--warn);font-weight:500}
.unit{display:flex;align-items:center;gap:.4rem}.unit span{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.swatches{display:flex;gap:.5rem;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:.45rem;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:.25rem .75rem .25rem .3rem;cursor:pointer;font-size:.85rem}
.sw i{width:1.1rem;height:1.1rem;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.check{display:flex;gap:.6rem;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:.7rem .8rem;cursor:pointer;background:var(--surface)}
.check[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check input{margin-top:.25rem}
.drop{border:2px dashed var(--line);border-radius:10px;padding:1rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;background:var(--surface)}
.price{border-radius:10px;padding:.9rem;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:.4rem}
.price.est{border-color:var(--accent)}
.price.man{background:var(--warn-soft);border-color:var(--warn)}
.price .big{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.price ul{margin:.2rem 0 0;padding-left:1.1rem;font-size:.85rem}
.sum{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:.85rem;margin:0}
.sum dt{color:var(--ink-2)}.sum dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl-w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
tr.cur td{background:var(--accent-soft);font-weight:600}
.item{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:.9rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .thumb{background:var(--stage);border-radius:8px;padding:.15rem}
.item .thumb svg{display:block;width:100%;height:auto}
.item-b{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.item-p{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.item{grid-template-columns:76px minmax(0,1fr)}.item-p{grid-column:1/-1;text-align:left}}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:flex;gap:.75rem;position:relative;padding-bottom:.9rem;color:var(--ink-2)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:.46rem;top:1.1rem;bottom:-.1rem;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:1rem;height:1rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;margin-top:.15rem;z-index:1}
.tl li.done .dot{background:var(--good);border-color:var(--good)}
.tl li.done{color:var(--ink)}
.tl li.cur .dot{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.tl li.cur{color:var(--ink)}
.tl small{display:block}
.act-card{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--warn)}
.empty{text-align:center;padding:2rem 1rem;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.875rem;z-index:60;max-width:calc(100% - 2rem)}
.modal-b{position:fixed;inset:0;background:rgba(10,15,13,.55);display:grid;place-items:center;padding:1rem;z-index:50}
.modal{background:var(--surface);border-radius:12px;padding:1.25rem;max-width:460px;width:100%;display:flex;flex-direction:column;gap:.9rem;border:1px solid var(--line);max-height:100%;overflow:auto}
.copybox{font-family:var(--f-mono);font-size:.82rem;background:var(--surface-2);border-radius:8px;padding:.6rem .7rem;user-select:all;overflow-wrap:anywhere}
.autobar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap}
.autobar .msg{max-width:70ch}
.autobar .btn{background:transparent;color:var(--bg);border-color:var(--bg)}
.pulse{width:.6rem;height:.6rem;border-radius:50%;background:#4FC4A8;display:inline-block;margin-right:.5rem}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}}
</style>

function hashSpec(d){return [d.modelo,d.C,d.L,d.A,d.onda,d.capa,d.imp,d.cores.join('+'),d.faces,d.acab.join('+')].join('|');}

/* ===== Cálculo da estimativa ===== */
function area(d){
  var C=Math.max(+d.C||1,1),L=Math.max(+d.L||1,1),A=Math.max(+d.A||1,1),e=ONDAS[d.onda].e;
  if(d.modelo==='envio'){return (C+2*A+30+20)*(2*L+2*A+40+20)/1e6;}
  if(d.modelo==='tampa'){return (C+A+20)*(L+A+20)*2/1e6;}
  return (2*C+2*L+35+4*e+20)*(A+L+2*e+20)/1e6;
}
function escala(q){return q<500?1.12:q<1000?1.06:q<3000?1:q<10000?.95:.91;}
function calc(d,qty){
  qty=qty==null?(+d.qty||0):qty;
  var mod=MODELOS[d.modelo],r=[];
  if(mod.manual){r.push('Modelo fora do catálogo padrão');}
  else{var out=[];[['C','comprimento'],['L','largura'],['A','altura']].forEach(function(k){var v=+d[k[0]],lim=mod.lim[k[0]];if(v<lim[0]||v>lim[1]){out.push(k[1]+' ('+lim[0]+' a '+lim[1]+' mm)');}});
    if(out.length){r.push('Medida fora do limite automático: '+out.join(', '));}}
  if(d.imp&&d.quatro){r.push('Mais de 3 cores de impressão');}
  if(d.acab.length){r.push('Acabamento especial: '+d.acab.map(function(a){return ACAB[a].toLowerCase();}).join(', '));}
  if(qty<MINQ){r.push('Quantidade abaixo do pedido mínimo da demonstração ('+num(MINQ)+')');}
  if(qty>MAXQ){r.push('Quantidade acima do teto automático ('+num(MAXQ)+')');}
  if(TECH.test(d.obs||'')){r.push('Pedido técnico nas observações (certificação ou teste)');}
  var q=Math.max(qty,1),o=ONDAS[d.onda];
  var mat=area(d)*o.preco[d.capa]*(1+PERDA);
  var nc=d.imp?Math.min(d.cores.length||1,3):0,nf=d.imp?FACES_N[d.faces]:0;
  var ferr=d.recompra?0:(nc*nf*55+(mod.faca||0));
  var unit=(mat+nc*nf*0.03+(ferr+SETUP)/q)*(1+MARGEM)*escala(q);
  return {manual:r.length>0,reasons:r,mid:unit,min:unit*(1-TOL),max:unit*(1+TOL),qty:qty};
}
function priceTxt(c,qty){
  if(c.manual){return 'Sob consulta';}
  return brl(c.min)+' a '+brl(c.max)+' /un';
}
function totTxt(c){return c.manual?'':brl0(c.min*c.qty)+' a '+brl0(c.max*c.qty);}
function summary(d){
  var m=MODELOS[d.modelo],o=ONDAS[d.onda];
  var imp=d.imp?((d.quatro?'4 ou mais':String(d.cores.length||1))+' cor(es), '+FACES[d.faces].toLowerCase()):'sem impressão';
  return m.nome+' · '+o.nome+' '+d.capa+' · '+imp;
}

/* ===== Prévia da caixa (projeção isométrica) ===== */
function logoSVG(w,h,cores){
  var m=Math.min(w,h),px=w*.14,py=h*.2,bw=w*.72,bh=h*.5,s='';
  s+='<rect x="'+px+'" y="'+py+'" width="'+bw+'" height="'+bh+'" rx="'+(m*.04)+'" fill="'+cores[0]+'"/>';
  s+='<text x="'+(w/2)+'" y="'+(py+bh*.62)+'" text-anchor="middle" font-family="Archivo,Arial,sans-serif" font-weight="800" font-size="'+Math.min(bh*.34,bw*.14)+'" fill="'+(cores[1]||'#F5F1E8')+'">SUA MARCA</text>';
  if(cores[2]){s+='<rect x="'+px+'" y="'+(py+bh+h*.06)+'" width="'+bw+'" height="'+(h*.05)+'" fill="'+cores[2]+'"/>';}
  return s;
}
function boxSVG(d,mini){
  var C=Math.max(+d.C||1,1),L=Math.max(+d.L||1,1),A=Math.max(+d.A||1,1),W=360,H=280,c=.866,s=.5;
  var k=Math.min((W-170)/((C+L)*c),(H-80)/((C+L)*s+A));
  var minX=-L*c*k,maxX=C*c*k,minY=-A*k,maxY=(C+L)*s*k;
  var tx=(W-(maxX-minX))/2-minX+14,ty=(H-(maxY-minY))/2-minY;
  function X(x,y){return (x-y)*c*k+tx;}
  function Y(x,y,z){return (x+y)*s*k-z*k+ty;}
  function P(x,y,z){return X(x,y).toFixed(1)+','+Y(x,y,z).toFixed(1);}
  var col=d.capa==='branco'?{t:'#F5F3EE',l:'#E3DFD4',r:'#CBC6B8',ln:'#8E897A'}:{t:'#DDBD90',l:'#C79B66',r:'#A67C4B',ln:'#6C4F2B'};
  function poly(pts,f){return '<polygon points="'+pts.join(' ')+'" fill="'+f+'" stroke="'+col.ln+'" stroke-width="1" stroke-linejoin="round"/>';}
  function ln(a,b){return '<polyline points="'+a+' '+b+'" fill="none" stroke="'+col.ln+'" stroke-width="1" stroke-linecap="round"/>';}
  var g='';
  g+=poly([P(0,0,A),P(C,0,A),P(C,L,A),P(0,L,A)],col.t);
  g+=poly([P(0,L,0),P(C,L,0),P(C,L,A),P(0,L,A)],col.l);
  g+=poly([P(C,0,0),P(C,L,0),P(C,L,A),P(C,0,A)],col.r);
  if(d.modelo==='envio'){g+=ln(P(0,L*.8,A),P(C,L*.8,A));}
  else if(d.modelo==='tampa'){g+=ln(P(0,L,A*.7),P(C,L,A*.7))+ln(P(C,L,A*.7),P(C,0,A*.7));}
  else{g+=ln(P(0,L/2,A),P(C,L/2,A));}
  if(d.imp){
    var cores=(d.cores.length?d.cores:['preto']).map(function(id){return COR[id].hex;});
    g+='<g transform="matrix('+(c*k).toFixed(4)+' '+(s*k).toFixed(4)+' 0 '+k.toFixed(4)+' '+X(0,L).toFixed(2)+' '+Y(0,L,A).toFixed(2)+')">'+logoSVG(C,A,cores)+'</g>';
    if(d.faces!=='frente'){g+='<g transform="matrix('+(c*k).toFixed(4)+' '+(-s*k).toFixed(4)+' 0 '+k.toFixed(4)+' '+X(C,L).toFixed(2)+' '+Y(C,L,A).toFixed(2)+')">'+logoSVG(L,A,cores)+'</g>';}
  }
  if(!mini){
    var lab='font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink-2)"';
    g+='<text x="'+(X(C/2,L)-8).toFixed(1)+'" y="'+(Y(C/2,L,0)+18).toFixed(1)+'" text-anchor="end" '+lab+'>C '+d.C+' mm</text>';
    g+='<text x="'+(X(C,L/2)+8).toFixed(1)+'" y="'+(Y(C,L/2,0)+18).toFixed(1)+'" '+lab+'>L '+d.L+' mm</text>';
    g+='<text x="'+(X(0,L)-8).toFixed(1)+'" y="'+(Y(0,L,A/2)+4).toFixed(1)+'" text-anchor="end" '+lab+'>A '+d.A+' mm</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Prévia da caixa '+esc(MODELOS[d.modelo].nome)+' com '+d.C+' por '+d.L+' por '+d.A+' milímetros">'+g+'</svg>';
}

function stepsFor(hasArt){return hasArt?['Pedido confirmado','Aguardando arte','Prova enviada','Arte aprovada','Em produção','Pronto para expedição','Expedido','Entregue']:['Pedido confirmado','Em produção','Pronto para expedição','Expedido','Entregue'];}
function mkOrder(itens,upto,ageDays,proto){
  var hasArt=itens.some(function(i){return i.spec.imp;});var st=stepsFor(hasArt);
  var idx=typeof upto==='string'?st.indexOf(upto):upto;var t0=daysAgo(ageDays),hist=[];
  for(var i=0;i<=idx;i++){hist.push(new Date(t0.getTime()+i*86400000));}
  return {id:'PED-'+new Date().getFullYear()+'-'+(S.seq.o++),quote:proto||'',itens:itens,steps:st,idx:idx,hist:hist,criada:t0};
}
function seed(p){
  S.packs=[];S.orders=[];S.quotes=[];S.cart=[];
  p.packs.forEach(function(k,i){var d=mk(k.s);d.nome=k.nome;d.qty=k.qty;d.arte={nome:k.arte,size:2400000};
    var c=calc(d);S.packs.push({id:'k'+i,nome:k.nome,spec:d,qty:k.qty,ult:c.mid,quando:daysAgo(20+i*35)});});
  var a=S.packs[0],b=S.packs[1];
  S.orders.push(mkOrder([{spec:a.spec,qty:a.qty,mid:a.ult}],'Em produção',6));
  S.orders.push(mkOrder([{spec:b.spec,qty:b.qty,mid:b.ult}],'Entregue',40));
  var d2=clone(b.spec);d2.qty=b.qty*2;var c2=calc(d2);
  S.quotes.push({id:'COT-'+new Date().getFullYear()+'-'+(S.seq.c++),status:'proposta',criada:daysAgo(2),itens:[{spec:d2,qty:d2.qty,mid:c2.mid,manual:false,firme:c2.mid*.97}],entrega:p.cidade,valida:new Date(Date.now()+5*86400000),hist:[daysAgo(2),daysAgo(1.5),daysAgo(1)]});
}

    '<div class="field"><label for="f-data">Data desejada de entrega</label><input id="f-data" type="date" data-f="data" value="'+esc(d.data)+'"><span class="hint">A Atto confirma o prazo na proposta.</span></div></div>'+
    '<div id="qty-tbl">'+qtyTable()+'</div>';

    if(d.imp){

function qtyTable(){

  return '<div class="tbl-w"><table><thead><tr><th>Quantidade</th><th>Por unidade</th><th>Total</th></tr></thead><tbody>'+list.map(function(q){var x=calc(d,q);return '<tr'+(q===near?' class="cur"':'')+'><td class="num">'+num(q)+'</td><td class="num">'+brl(x.min)+' a '+brl(x.max)+'</td><td class="num">'+brl0(x.min*q)+' a '+brl0(x.max*q)+'</td></tr>';}).join('')+'</tbody></table></div><p class="hint">Quanto maior a quantidade, menor o valor por unidade.</p>';

  '<div class="cfg"><section class="card">'+q.itens.map(function(i){var c=calc(i.spec,i.qty);

    return '<div class="item"><div class="thumb stage">'+boxSVG(i.spec,true)+'</div><div class="item-b"><b>'+esc(i.spec.nome||MODELOS[i.spec.modelo].nome)+'</b><span class="mono sm-t">'+i.spec.C+'×'+i.spec.L+'×'+i.spec.A+' mm · '+num(i.qty)+' un</span><small>'+esc(summary(i.spec))+'</small></div><div class="item-p">'+left+'</div></div>';}).join('')+
  (st==='proposta'?'<div class="row sp" style="padding-top:.9rem"><span>Proposta válida até <b>'+fmtD(q.valida)+'</b></span><b class="num">Total '+brl0(tot)+'</b></div><small>Preço firme, sem frete. Condições de pagamento e prazo confirmados pelo vendedor.</small>':'')+'</section>'+
  '<aside class="side"><div class="card"><h3 style="margin-bottom:.75rem">Andamento</h3>'+(st==='recusada'?'<p>Proposta recusada.</p>':timeline(Q_STEPS,qIdx(st),q.hist))+'</div>'+(acts?'<div class="row">'+acts+'</div>':'')+demo+'<button class="btn" data-act="contact">Falar com o vendedor</button></aside></div>';

function timeline(steps,idx,hist){

}

/* ===== Render ===== */
function render(){
  var app=$('#app');
  if(!S.user){app.innerHTML=viewLogin()+autoBar();return;}
  var v=S.view,body='';
  if(v==='home'){body=viewHome();}else if(v==='config'){body=viewCfg();}else if(v==='cart'){body=viewCart();}else if(v==='sent'){body=viewSent();}
  else if(v==='quotes'){body=viewQuotes();}else if(v==='orders'){body=viewOrders();}else if(v==='packs'){body=viewPacks();}
  app.innerHTML=header()+'<main class="wrap">'+body+'</main>'+autoBar()+modalHTML();

function refreshSide(){var el=$('#side');if(el){el.innerHTML=sideHTML();}['C','L','A'].forEach(function(k){var h=$('#hint-'+k);if(h){h.innerHTML=hint(k);}});var t=$('#qty-tbl');if(t){t.innerHTML=qtyTable();}}

/* ===== Ações ===== */
function newDraft(base){S.draft=mk(base);S.step=0;S.editIdx=null;}
function addCart(){
  var d=S.draft;
  if(!d.nome){d.nome=MODELOS[d.modelo].nome+' '+d.C+'×'+d.L+'×'+d.A;}
  var hit=S.packs.filter(function(k){return hashSpec(k.spec)===hashSpec(d);})[0];
  var it={spec:clone(d),qty:d.qty};
  if(hit){it.spec.recompra=true;it.nota='Mesma especificação de “'+hit.nome+'”: clichê e faca não são cobrados de novo.';}
  if(S.editIdx!=null){S.cart[S.editIdx]=it;}else{S.cart.push(it);}
  S.editIdx=null;S.view='cart';
}
function sendQuote(){
  var q={id:'COT-'+new Date().getFullYear()+'-'+(S.seq.c++),status:'solicitada',criada:new Date(),entrega:S.entrega,valida:null,hist:[new Date()],itens:S.cart.map(function(it){var c=calc(it.spec,it.qty);return {spec:it.spec,qty:it.qty,mid:c.mid,manual:c.manual,firme:c.mid*(c.manual?1.15:1)};})};
  S.quotes.unshift(q);S.cart=[];S.sent=q;S.view='sent';return q;
}
function advQuote(id){
  var q=S.quotes.filter(function(x){return x.id===id;})[0];
  if(q.status==='solicitada'){q.status='analise';}else if(q.status==='analise'){q.status='proposta';q.valida=new Date(Date.now()+7*86400000);}
  q.hist.push(new Date());
}
function acceptQuote(id){
  var q=S.quotes.filter(function(x){return x.id===id;})[0];q.status='aceita';q.hist.push(new Date());
  var o=mkOrder(q.itens.map(function(i){return {spec:i.spec,qty:i.qty,mid:i.firme};}),0,0,q.id);S.orders.unshift(o);
  q.itens.forEach(function(i){var h=hashSpec(i.spec);if(!S.packs.some(function(k){return hashSpec(k.spec)===h;})){S.packs.unshift({id:'k'+Date.now()+Math.random(),nome:i.spec.nome,spec:clone(i.spec),qty:i.qty,ult:i.firme,quando:new Date()});}});
  return o;
}
function advOrder(id){var o=S.orders.filter(function(x){return x.id===id;})[0];if(o.idx<o.steps.length-1){o.idx++;o.hist.push(new Date());}}
function repeatSpec(spec,qty,nome){
  var s=clone(spec);s.recompra=true;s.nome=nome||s.nome;
  var old=S.packs.filter(function(k){return hashSpec(k.spec)===hashSpec(s);})[0];
  var c=calc(s,qty),it={spec:s,qty:qty,nota:'Clichê e faca já pagos: não entram no preço.'};
  if(old&&!c.manual){var diff=c.mid-old.ult;it.nota+=' Último preço: '+brl(old.ult)+'/un. '+(Math.abs(diff)<.005?'O preço não mudou.':'Preço atual estimado '+(diff>0?'maior':'menor')+' em '+brl(Math.abs(diff))+'/un.');}
  S.cart.push(it);S.view='cart';toast('Itens copiados para o carrinho.');
}
var TOP=['login','go','newBox','step','next','prev','addCart','editCart','sendQuote','openQuote','openOrder','acceptQuote','repeatOrder','repeatPack','editPack'];
function act(a,v,el){
  switch(a){
    case 'login':doLogin(v);break;
    case 'logout':S.user=null;S.view='login';S.auto=null;break;
    case 'go':S.view=v;S.selQ=null;S.selO=null;break;
    case 'newBox':newDraft();S.view='config';break;
    case 'step':S.step=+v;break;
    case 'next':S.step=Math.min(6,S.step+1);break;
    case 'prev':S.step=Math.max(0,S.step-1);break;
    case 'set':{var d=S.draft;if(el.dataset.k==='imp'){d.imp=v==='1';if(!d.imp){d.cores=[];d.quatro=false;}}else{d[el.dataset.k]=v;}break;}
    case 'toggleCor':{var cs=S.draft.cores,i=cs.indexOf(v);if(i>-1){cs.splice(i,1);}else if(cs.length<3){cs.push(v);}else{toast('O limite automático é de 3 cores. Marque “mais de 3 cores” para pedir cotação.');}break;}
    case 'toggleAcab':{var ac=S.draft.acab,j=ac.indexOf(v);if(j>-1){ac.splice(j,1);}else{ac.push(v);}break;}
    case 'quickQty':S.draft.qty=+v;break;
    case 'clearArte':S.draft.arte=null;break;
    case 'addCart':addCart();break;
    case 'rmCart':S.cart.splice(+v,1);break;
    case 'editCart':S.draft=clone(S.cart[+v].spec);S.draft.qty=S.cart[+v].qty;S.editIdx=+v;S.step=0;S.view='config';break;
    case 'sendQuote':sendQuote();break;
    case 'openQuote':S.view='quotes';S.selQ=v;break;
    case 'openOrder':S.view='orders';S.selO=v;break;
    case 'advQuote':advQuote(v);break;
    case 'acceptQuote':{var o=acceptQuote(v);toast('Proposta aceita. Pedido '+o.id+' criado.');S.view='orders';S.selO=o.id;break;}
    case 'refuseQuote':{var q=S.quotes.filter(function(x){return x.id===v;})[0];q.status='recusada';toast('Proposta recusada.');break;}
    case 'advOrder':advOrder(v);break;
    case 'approveProof':{var oo=S.orders.filter(function(x){return x.id===v;})[0];advOrder(v);toast('Prova aprovada em '+fmtT(new Date())+' por '+S.user.user+'.');break;}
    case 'repeatOrder':{var or=S.orders.filter(function(x){return x.id===v;})[0];or.itens.forEach(function(i){repeatSpec(i.spec,i.qty);});break;}
    case 'repeatPack':{var k=S.packs.filter(function(x){return x.id===v;})[0];repeatSpec(k.spec,k.qty,k.nome);break;}
    case 'editPack':{var k2=S.packs.filter(function(x){return x.id===v;})[0];newDraft(k2.spec);S.draft.recompra=false;S.draft.nome=k2.nome+' (nova)';S.draft.qty=k2.qty;S.view='config';break;}
    case 'contact':S.modal=true;break;
    case 'closeModal':S.modal=false;break;
    case 'copy':copyMsg();return;
    case 'autoStart':autoRun(v);return;
    case 'autoStop':S.auto=null;break;
  }
  render();if(TOP.indexOf(a)>-1){window.scrollTo(0,0);}
}
function copyMsg(){
  var t=$('#msgbox').textContent;
  function fb(){var r=document.createRange();r.selectNodeContents($('#msgbox'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado. Copie com Ctrl+C.');}
  try{navigator.clipboard.writeText(t).then(function(){toast('Mensagem copiada.');},fb);}catch(e){fb();}
}
function fileChosen(t){
  var f=t.files&&t.files[0];if(!f){return;}
  var ext=f.name.split('.').pop().toLowerCase(),msg=$('#arte-msg');
  if(EXT.indexOf(ext)<0){msg.textContent='Formato .'+ext+' não é aceito. Use PDF, AI, EPS, SVG, CDR, PNG ou JPG.';msg.className='hint err';t.value='';return;}
  if(f.size>100*1048576){msg.textContent='O arquivo passa de 100 MB. Envie uma versão menor.';msg.className='hint err';t.value='';return;}
  S.draft.arte={nome:f.name,size:f.size};render();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled){return;}
  if(b.classList.contains('modal-b')&&e.target!==b){return;}
  act(b.dataset.act,b.dataset.v,b);
});
document.addEventListener('input',function(e){
  var t=e.target,f=t.dataset&&t.dataset.f;if(!f){return;}
  var d=S.draft;
  if(f==='C'||f==='L'||f==='A'||f==='qty'){d[f]=+t.value||0;refreshSide();var nx=document.querySelector('[data-act="next"]');if(nx&&S.step===1){nx.disabled=!(d.C>0&&d.L>0&&d.A>0);}}
  else if(f==='nome'||f==='obs'||f==='data'){d[f]=t.value;if(f==='obs'){refreshSide();}}
  else if(f==='obsCart'){S.obsCart=t.value;}
});
document.addEventListener('change',function(e){
  var t=e.target;if(t.id==='arte-file'){fileChosen(t);return;}
  var f=t.dataset&&t.dataset.f;if(!f){return;}
  if(f==='quatro'){S.draft.quatro=t.checked;render();}
  else if(f==='depois'){S.draft.depois=t.checked;}
  else if(f==='ent'){S.entrega=t.value;}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=false;render();}});

/* ===== Simulação automática ===== */
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function autoRun(pid){
  var p=PERS.filter(function(x){return x.id===pid;})[0],first=p.user.split(' ')[0],dm=p.demo;
  S.user=null;S.auto={who:first,msg:'',run:true};
  async function say(msg,fn,ms){if(!S.auto||!S.auto.run){throw new Error('stop');}S.auto.msg=msg;if(fn){fn();}render();await wait(ms||1700);}
  try{
    await say('entra no portal com o CNPJ da '+p.empresa+'.',function(){doLogin(pid);},1900);
    await say('vê o painel: pedidos em andamento e uma proposta esperando aceite.',null,2000);
    await say('clica em “Nova caixa”.',function(){newDraft();S.view='config';S.draft.nome=dm.nome;},1500);
    await say('escolhe o modelo: '+MODELOS[dm.modelo].nome.toLowerCase()+'.',function(){S.draft.modelo=dm.modelo;},1800);
    await say('informa as medidas internas: '+dm.C+' × '+dm.L+' × '+dm.A+' mm.',function(){S.step=1;S.draft.C=dm.C;S.draft.L=dm.L;S.draft.A=dm.A;},2200);
    await say('escolhe o papelão: '+ONDAS[dm.onda].nome+', capa '+dm.capa+'.',function(){S.step=2;S.draft.onda=dm.onda;S.draft.capa=dm.capa;},2000);
    await say('define a impressão: '+dm.cores.length+' cor(es), '+FACES[dm.faces].toLowerCase()+'.',function(){S.step=3;S.draft.imp=true;S.draft.cores=dm.cores.slice();S.draft.faces=dm.faces;},2400);
    await say(dm.acab.length?'marca um acabamento. O sistema avisa que isso vai para cotação.':'não precisa de acabamento especial.',function(){S.step=4;S.draft.acab=dm.acab.slice();},2200);
    await say('informa a quantidade: '+num(dm.qty)+' unidades. A tabela mostra quanto o preço cai com mais volume.',function(){S.step=5;S.draft.qty=dm.qty;},2600);
    await say('envia a arte ('+dm.arte.nome+') e escreve uma observação.',function(){S.step=6;S.draft.arte=dm.arte;S.draft.obs=dm.obs;},2600);
    await say('revisa a estimativa e adiciona ao carrinho.',null,2000);
    await say('adiciona a caixa ao carrinho.',function(){addCart();},1800);
    await say('solicita a cotação.',function(){sendQuote();},2200);
    await say('acompanha a cotação. Agora a equipe da Atto assume o pedido.',function(){var q=S.sent;S.view='quotes';S.selQ=q.id;advQuote(q.id);},2200);
    await say('a Atto envia a proposta firme, com preço e validade.',function(){advQuote(S.selQ);},2400);
    await say('aceita a proposta. O pedido é criado.',function(){var o=acceptQuote(S.selQ);S.view='orders';S.selO=o.id;},2400);
    await say('a Atto envia a prova de arte.',function(){advOrder(S.selO);advOrder(S.selO);},2200);
    await say('aprova a prova. A aprovação fica registrada e a produção começa.',function(){advOrder(S.selO);advOrder(S.selO);},2600);
    S.auto.run=false;S.auto.msg='fim da simulação. Você pode mexer em tudo: repetir o pedido, abrir as minhas embalagens ou configurar outra caixa.';render();
  }catch(e){if(e.message!=='stop'){S.auto=null;render();throw e;}}
}

render();
})();
</script>
